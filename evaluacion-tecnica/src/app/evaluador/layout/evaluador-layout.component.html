<div class="layout-container">
  <mat-toolbar class="toolbar">
    <button mat-icon-button (click)="toggleSidenav()" class="menu-btn">
      <mat-icon>menu</mat-icon>
    </button>
    <div class="logo">
      <div class="logo-icon">
        <mat-icon>psychology</mat-icon>
      </div>
      <span class="logo-text">EvalTech IA</span>
    </div>
    <span class="flex-1"></span>
    <span class="user-name">{{ authService.nombreCompleto() }}</span>
    <button mat-icon-button (click)="logout()" matTooltip="Cerrar sesión" class="logout-btn">
      <mat-icon>logout</mat-icon>
    </button>
  </mat-toolbar>

  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav
      [opened]="sidenavAbierto()"
      mode="side"
      class="sidenav">
      <mat-nav-list class="nav-list">
        <div class="nav-section">
          <a mat-list-item routerLink="dashboard" routerLinkActive="active-link">
            <mat-icon matListItemIcon>dashboard</mat-icon>
            <span matListItemTitle>Dashboard</span>
          </a>
          <a mat-list-item routerLink="crear" routerLinkActive="active-link">
            <mat-icon matListItemIcon>add_circle</mat-icon>
            <span matListItemTitle>Nueva Evaluación</span>
          </a>
        </div>

        <div class="nav-divider">
          <span class="nav-section-label">Resultados</span>
        </div>
        <div class="nav-section">
          <a mat-list-item routerLink="resultados" routerLinkActive="active-link">
            <mat-icon matListItemIcon>analytics</mat-icon>
            <span matListItemTitle>Resultados</span>
          </a>
          <a mat-list-item routerLink="rankings" routerLinkActive="active-link">
            <mat-icon matListItemIcon>leaderboard</mat-icon>
            <span matListItemTitle>Rankings</span>
          </a>
        </div>

        <div class="nav-divider">
          <span class="nav-section-label">En Vivo</span>
        </div>
        <div class="nav-section">
          <a mat-list-item routerLink="sesiones" routerLinkActive="active-link">
            <mat-icon matListItemIcon>videocam</mat-icon>
            <span matListItemTitle>Sesiones en Vivo</span>
          </a>
        </div>
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content class="main-content">
      <router-outlet />
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
