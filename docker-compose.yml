version: '3.9'

# ============================================================
# Docker Compose - SQL Server 2022 para EvaluacionTecnicaDB
# ============================================================
# Uso:
#   Levantar:  docker compose up -d
#   Detener:   docker compose down
#   Logs:      docker compose logs -f sqlserver
#   Eliminar volumenes (reset total): docker compose down -v
# ============================================================

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver_evaluacion
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong!Passw0rd
      - MSSQL_PID=Developer
      - TZ=America/Guatemala
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -Q 'SELECT 1' -No -b"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  sqlserver_data:
    driver: local
